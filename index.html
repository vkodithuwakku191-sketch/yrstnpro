<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YERN PRO — Next Generation Cyber Social Media</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --secondary:#111111;
  --card:#1A1A1A;
  --border:#666666;
  --glow:#BFBFBF;
  --text:#FFFFFF;
  --accent:#8C8C8C;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow-x:hidden; background:#000; }
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* LOADER */
#loader{
  position:fixed; inset:0; z-index:9999;
  background:#000;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .8s ease;
}
#loader.fade-out{ opacity:0; pointer-events:none; }
.loader-inner{ display:flex; flex-direction:column; align-items:center; gap:18px; }
.loader-ring{
  position:relative; width:168px; height:168px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.loader-ring::before{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, var(--glow) 60deg, transparent 120deg, var(--glow) 200deg, transparent 280deg);
  animation:spin 1.4s linear infinite;
  filter:blur(3px);
}
.loader-ring-inner{
  position:absolute; inset:7px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #151515, #000);
  border:1px solid var(--border);
  box-shadow:inset 0 0 30px rgba(191,191,191,0.15), 0 0 40px rgba(0,0,0,0.9);
}
.loader-logo{
  width:96px; height:96px; border-radius:50%; object-fit:cover; position:relative; z-index:2;
  filter:brightness(1.15) contrast(1.1) drop-shadow(0 0 18px rgba(191,191,191,0.7));
  animation:pulseLogo 2s ease-in-out infinite;
}
.loader-title{
  font-family:'Orbitron', monospace; font-weight:900; font-size:1.9rem; letter-spacing:5px;
  color:var(--text); text-shadow:0 0 12px var(--glow), 0 0 28px rgba(191,191,191,0.6);
  animation:flicker 3s infinite;
}
.progress-wrap{
  width:300px; max-width:72vw; height:6px; background:#0a0a0a; border:1px solid #333;
  border-radius:8px; overflow:hidden; position:relative; box-shadow:inset 0 0 10px #000, 0 0 12px rgba(191,191,191,0.15);
}
.progress-bar{
  height:100%; width:0%;
  background:linear-gradient(90deg, #444, var(--glow), #777);
  box-shadow:0 0 14px rgba(191,191,191,0.7);
  position:relative;
}
.progress-bar::after{
  content:''; position:absolute; top:0; bottom:0; right:0; width:30px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
  filter:blur(4px); mix-blend-mode:screen;
}
.progress-text{
  font-family:'Orbitron'; font-size:.85rem; letter-spacing:3px; color:var(--accent);
}

/* BACKGROUND */
canvas{ position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; display:block; }
#matrix{ z-index:1; opacity:.38; }
#grid{ z-index:2; opacity:.32; }
#particles{ z-index:14; }
.dark-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.62); z-index:2; pointer-events:none; }
.mouse-glow{
  position:fixed; width:520px; height:520px; border-radius:50%;
  background:radial-gradient(circle, rgba(191,191,191,0.09) 0%, rgba(191,191,191,0.04) 30%, transparent 65%);
  pointer-events:none; z-index:3; transform:translate(-50%,-50%); filter:blur(30px); mix-blend-mode:screen;
  will-change:transform;
}
.scanlines{
  position:fixed; inset:0; z-index:5; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 2px, transparent 3px, rgba(191,191,191,0.025) 4px);
  animation:scan 7s linear infinite;
  opacity:.7;
}
.noise{
  position:fixed; inset:0; z-index:4; pointer-events:none; opacity:.035; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* MAIN */
.container{
  position:relative; z-index:10; min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center; padding:40px 20px;
}
.glass-card{
  position:relative; width:100%; max-width:780px;
  background:rgba(26,26,26,0.52); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border); border-radius:28px; padding:64px 40px 54px;
  box-shadow:0 0 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 40px rgba(191,191,191,0.12);
  text-align:center; overflow:hidden;
}
.glass-card::before{
  content:''; position:absolute; inset:-1px; border-radius:inherit;
  background:linear-gradient(120deg, transparent 20%, rgba(191,191,191,0.25), transparent 60%);
  opacity:0; transition:opacity .6s; filter:blur(18px); z-index:-1;
}
.glass-card:hover::before{ opacity:.5; }

.logo-wrap{
  position:relative; width:224px; height:224px; margin:0 auto 32px; animation:float 4.2s ease-in-out infinite;
}
.logo-frame{
  position:relative; width:100%; height:100%; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #222, #0a0a0a 60%, #000);
  border:2px solid #5a5a5a;
  box-shadow:0 0 35px rgba(191,191,191,0.35), inset 0 0 35px rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.logo-frame img{
  width:142px; height:142px; border-radius:50%; object-fit:cover;
  filter:brightness(1.12) contrast(1.08) drop-shadow(0 0 22px rgba(191,191,191,0.55));
}
.logo-ring{ position:absolute; inset:-14px; border-radius:50%; }
.logo-ring::before{
  content:''; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, #8a8a8a 40deg, transparent 90deg, var(--glow) 180deg, transparent 230deg, #777 310deg, transparent 360deg);
  animation:spin 3.8s linear infinite;
  -webkit-mask:radial-gradient(circle, transparent 67%, black 70%);
  mask:radial-gradient(circle, transparent 67%, black 70%);
  filter:blur(0.5px);
}
.logo-ring::after{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  border:1px solid rgba(191,191,191,0.28); box-shadow:0 0 24px rgba(191,191,191,0.45), inset 0 0 18px rgba(191,191,191,0.15);
  animation:pulseRing 3s ease-in-out infinite;
}
.title{
  font-family:'Orbitron', monospace; font-weight:900;
  font-size:clamp(2.8rem, 9vw, 5.6rem); letter-spacing:6px; line-height:1.05; margin:0;
  background:linear-gradient(180deg, #fff 0%, #d9d9d9 45%, #8c8c8c 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow:0 0 24px rgba(191,191,191,0.35);
  min-height:1.2em; position:relative;
  animation:flicker 6s infinite 1s;
}
.title::after{
  content:''; position:absolute; left:50%; bottom:-12px; transform:translateX(-50%);
  width:56%; height:2px; background:linear-gradient(90deg, transparent, var(--glow), transparent);
  filter:blur(1.5px); opacity:.8;
}
.subtitle{
  font-family:'Poppins'; color:var(--accent); font-weight:400; letter-spacing:2.2px;
  font-size:clamp(0.95rem, 2.2vw, 1.18rem); margin:28px 0 42px; text-transform:uppercase;
  opacity:0; transform:translateY(18px); transition:opacity 1s ease .4s, transform 1s ease .4s;
}
.subtitle.show{ opacity:1; transform:translateY(0); }

.buttons{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
.cyber-btn{
  position:relative; isolation:isolate; min-width:190px; padding:17px 42px;
  background:linear-gradient(180deg, rgba(35,35,35,0.85), rgba(15,15,15,0.85));
  border:1px solid var(--border); border-radius:14px; color:var(--text);
  font-family:'Orbitron', monospace; font-size:.98rem; letter-spacing:2.5px; font-weight:700;
  cursor:pointer; overflow:hidden; backdrop-filter:blur(8px);
  transition:transform .25s ease, border-color .25s, box-shadow .25s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 18px rgba(0,0,0,0.6);
}
.cyber-btn span{ position:relative; z-index:2; }
.cyber-btn::before{
  content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, rgba(191,191,191,0.22), transparent 70%);
  transform:translateX(-120%); transition:transform .7s ease;
}
.cyber-btn:hover::before{ transform:translateX(120%); }
.cyber-btn::after{
  content:''; position:absolute; inset:-2px; border-radius:14px; z-index:-1;
  background:linear-gradient(45deg, #666, var(--glow), #666);
  opacity:0; filter:blur(10px); transition:opacity .3s;
}
.cyber-btn:hover{
  transform:translateY(-2px) scale(1.035); border-color:var(--glow);
  box-shadow:0 0 22px rgba(191,191,191,0.48), 0 0 44px rgba(191,191,191,0.18), 0 12px 30px rgba(0,0,0,0.7);
}
.cyber-btn:hover::after{ opacity:1; }
.cyber-btn:active{ transform:scale(.98); }

.ripple{
  position:absolute; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(191,191,191,0.65) 0%, rgba(191,191,191,0.25) 40%, transparent 70%);
  transform:scale(0); animation:ripple .65s ease-out forwards; z-index:1;
}

/* Refresh */
.refresh{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:20;
  width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
  background:rgba(20,20,20,0.7); border:1px solid #555; color:var(--glow);
  font-size:1.35rem; cursor:pointer; backdrop-filter:blur(10px);
  box-shadow:0 0 16px rgba(191,191,191,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
  transition:transform .3s, box-shadow .3s, border-color .3s;
  animation:pulseRing 3.2s ease-in-out infinite;
}
.refresh:hover{ transform:translateX(-50%) scale(1.08) rotate(180deg); border-color:var(--glow); box-shadow:0 0 26px rgba(191,191,191,0.55); }

/* ANIMATIONS */
@keyframes spin{ to{ transform:rotate(360deg);} }
@keyframes pulseLogo{ 0%,100%{ transform:scale(1); filter:brightness(1.15) contrast(1.1) drop-shadow(0 0 18px rgba(191,191,191,0.7)); } 50%{ transform:scale(1.045); filter:brightness(1.25) contrast(1.1) drop-shadow(0 0 26px rgba(191,191,191,0.9)); } }
@keyframes pulseRing{ 0%,100%{ box-shadow:0 0 24px rgba(191,191,191,0.35), inset 0 0 14px rgba(191,191,191,0.12);} 50%{ box-shadow:0 0 36px rgba(191,191,191,0.55), inset 0 0 20px rgba(191,191,191,0.18);} }
@keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
@keyframes flicker{
  0%,18%,22%,25%,53%,57%,100%{ opacity:1; text-shadow:0 0 10px var(--glow),0 0 22px rgba(191,191,191,0.6),0 0 40px rgba(191,191,191,0.25);}
  20%,24%,55%{ opacity:.85; text-shadow:none;}
}
@keyframes ripple{ to{ transform:scale(4); opacity:0; } }
@keyframes scan{ 0%{ transform:translateY(0);} 100%{ transform:translateY(12px);} }

/* RESPONSIVE */
@media (max-width:680px){
  .glass-card{ padding:48px 22px 44px; border-radius:22px; }
  .logo-wrap{ width:180px; height:180px; margin-bottom:26px; }
  .logo-frame img{ width:112px; height:112px; }
  .buttons{ flex-direction:column; gap:14px; }
  .cyber-btn{ width:100%; min-width:unset; }
  .subtitle{ margin:22px 0 32px; letter-spacing:1.8px; }
  .mouse-glow{ display:none; }
  .progress-wrap{ width:260px; }
}
@media (max-height:700px){
  .container{ padding:24px 16px; }
  .logo-wrap{ width:160px; height:160px; }
}
</style>
</head>

<button class="refresh" id="refreshBtn" title="Reload" aria-label="Reload page">⟲</button>

<script>
(() => {
  const loader = document.getElementById('loader');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  // LOADER - exactly 4 seconds
  let start = performance.now();
  function animateLoader(t){
    const elapsed = t - start;
    const progress = Math.min(100, (elapsed / 4000) * 100);
    progressBar.style.width = progress + '%';
    progressText.textContent = Math.floor(progress) + '%';
    if (progress < 100) {
      requestAnimationFrame(animateLoader);
    } else {
      finishLoader();
    }
  }
  requestAnimationFrame(animateLoader);

  function finishLoader(){
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.style.display = 'none';
      initApp();
    }, 800);
  }

  // APP INIT
  function initApp(){
    typeTitle();
    document.querySelector('.subtitle').classList.add('show');
    initBackground();
    setupButtons();
    handleAutoOpen();
  }

  function typeTitle(){
    const el = document.getElementById('title');
    const text = 'YERN PRO';
    let i = 0;
    const timer = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(timer);
    }, 95);
  }

  // BUTTONS
  function setupButtons(){
    const dl = document.getElementById('downloadBtn');
    const br = document.getElementById('browserBtn');
    const rf = document.getElementById('refreshBtn');

    function ripple(e){
      const btn = e.currentTarget;
      const rect = btn.getBoundingClientRect();
      const r = document.createElement('span');
      r.className = 'ripple';
      const size = Math.max(rect.width, rect.height) * 1.3;
      r.style.width = r.style.height = size + 'px';
      r.style.left = (e.clientX - rect.left - size/2) + 'px';
      r.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 650);
    }

    [dl, br].forEach(b => b.addEventListener('pointerdown', ripple));

    dl.addEventListener('click', (e) => {
      createExplosion(e.clientX, e.clientY);
      localStorage.setItem('last_open', 'download');
      window.open('https://www.mediafire.com/file/8c1jzm4hxbs00tz/Yern+Pro.apk/file', '_blank');
    });
    br.addEventListener('click', (e) => {
      createExplosion(e.clientX, e.clientY);
      localStorage.setItem('last_open', 'browser');
      window.open('https://yern-pro-cyber-media.netlify.app/', '_blank');
    });
    rf.addEventListener('click', () => location.reload());
  }

  function handleAutoOpen(){
    const last = localStorage.getItem('last_open');
    if (last === 'download' || last === 'browser') {
      setTimeout(() => {
        if (last === 'download') {
          window.open('https://www.mediafire.com/file/8c1jzm4hxbs00tz/Yern+Pro.apk/file', '_blank');
        } else {
          window.open('https://yern-pro-cyber-media.netlify.app/', '_blank');
        }
      }, 4000);
    }
  }

  // BACKGROUND SYSTEMS
  let mCanvas, mCtx, mW, mH, drops = [], fontSize = 14, chars = '01 YERNPRO 010101 アカサタナハマヤラ ワ';
  let gCanvas, gCtx, gW, gH, gridOffset = 0;
  let pCanvas, pCtx, pW, pH, particles = [];

  function initBackground(){
    setupMatrix();
    setupGrid();
    setupParticles();
    setupMouse();
    window.addEventListener('resize', onResize, {passive:true});
  }

  function onResize(){
    resizeMatrix(); resizeGrid(); resizeParticles();
  }

  // MATRIX RAIN
  function setupMatrix(){
    mCanvas = document.getElementById('matrix');
    mCtx = mCanvas.getContext('2d', {alpha:true});
    resizeMatrix();
    animateMatrix();
  }
  function resizeMatrix(){
    mW = mCanvas.width = window.innerWidth;
    mH = mCanvas.height = window.innerHeight;
    const cols = Math.floor(mW / fontSize);
    drops = Array(cols).fill(0).map(() => Math.random() * -20);
  }
  function animateMatrix(){
    mCtx.fillStyle = 'rgba(0,0,0,0.06)';
    mCtx.fillRect(0,0,mW,mH);
    mCtx.font = fontSize + 'px monospace';
    for (let i=0;i<drops.length;i++){
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      const ch = chars[Math.floor(Math.random()*chars.length)];
      mCtx.fillStyle = Math.random() > 0.985 ? '#BFBFBF' : '#8C8C8C';
      mCtx.fillText(ch, x, y);
      if (y > mH && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.85 + Math.random()*0.5;
    }
    requestAnimationFrame(animateMatrix);
  }

  // GRID + FLOATING LINES
  function setupGrid(){
    gCanvas = document.getElementById('grid');
    gCtx = gCanvas.getContext('2d', {alpha:true});
    resizeGrid();
    animateGrid();
  }
  function resizeGrid(){
    gW = gCanvas.width = window.innerWidth;
    gH = gCanvas.height = window.innerHeight;
  }
  function animateGrid(){
    gCtx.clearRect(0,0,gW,gH);
    const spacing = 86;
    gridOffset = (gridOffset + 0.35) % spacing;
    gCtx.strokeStyle = 'rgba(102,102,102,0.16)';
    gCtx.lineWidth = 1;
    for (let x=0; x<gW; x+=spacing){
      gCtx.beginPath(); gCtx.moveTo(x,0); gCtx.lineTo(x,gH); gCtx.stroke();
    }
    for (let y=gridOffset; y<gH; y+=spacing){
      gCtx.beginPath(); gCtx.moveTo(0,y); gCtx.lineTo(gW,y); gCtx.stroke();
    }
    // floating digital lines
    const t = performance.now() * 0.02;
    for (let i=0;i<3;i++){
      const y = (t*8 + i*220) % gH;
      gCtx.beginPath();
      gCtx.moveTo(0, y);
      gCtx.lineTo(gW, y);
      gCtx.strokeStyle = 'rgba(191,191,191,0.12)';
      gCtx.lineWidth = 2;
      gCtx.shadowColor = '#BFBFBF';
      gCtx.shadowBlur = 12;
      gCtx.stroke();
    }
    gCtx.shadowBlur = 0;
    requestAnimationFrame(animateGrid);
  }

  // PARTICLES
  function setupParticles(){
    pCanvas = document.getElementById('particles');
    pCtx = pCanvas.getContext('2d', {alpha:true});
    resizeParticles();
    animateParticles();
  }
  function resizeParticles(){
    pW = pCanvas.width = window.innerWidth;
    pH = pCanvas.height = window.innerHeight;
  }
  function animateParticles(){
    pCtx.clearRect(0,0,pW,pH);
    particles = particles.filter(p => p.life > 0);
    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.vx *= 0.99;
      p.life -= 0.012;
      pCtx.globalAlpha = Math.max(0, p.life);
      pCtx.fillStyle = p.color;
      pCtx.shadowColor = p.color;
      pCtx.shadowBlur = 12;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      pCtx.fill();
    }
    pCtx.globalAlpha = 1;
    pCtx.shadowBlur = 0;
    requestAnimationFrame(animateParticles);
  }
  function createExplosion(x,y){
    const originX = x || window.innerWidth/2;
    const originY = y || window.innerHeight/2;
    for (let i=0;i<70;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 2 + Math.random()*6;
      particles.push({
        x: originX, y: originY,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - Math.random()*2,
        size: Math.random()*2.6 + 0.8,
        color: Math.random()>.2 ? '#BFBFBF' : '#8C8C8C',
        life: 1
      });
    }
  }
  window.createExplosion = createExplosion;

  // MOUSE GLOW
  function setupMouse(){
    const glow = document.getElementById('mouseGlow');
    let tx = window.innerWidth/2, ty = window.innerHeight/2;
    let cx = tx, cy = ty;
    window.addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; }, {passive:true});
    function loop(){
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      glow.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%)`;
      requestAnimationFrame(loop);
    }
    loop();
  }

})();
</script>
